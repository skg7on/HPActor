name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            cc: gcc
            cxx: g++
            build_type: Debug
          - name: clang-release
            cc: clang
            cxx: clang++
            build_type: Release

    env:
      BUILD_DIR: build/${{ matrix.name }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CTEST_OUTPUT_ON_FAILURE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libabsl-dev \
            libprotobuf-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            protobuf-compiler

      - name: Configure
        run: >
          cmake
          -S .
          -B "$BUILD_DIR"
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DENABLE_EXAMPLES=ON
          -DENABLE_PROACTOR=OFF

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure --timeout 30 --parallel $(nproc)

      - name: Upload CTest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.name }}
          path: |
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  coverage:
    name: coverage (gcc + lcov)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      BUILD_DIR: build/coverage
      CC: gcc
      CXX: g++
      CTEST_OUTPUT_ON_FAILURE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            lcov \
            libabsl-dev \
            libprotobuf-dev \
            libssl-dev \
            ninja-build \
            pkg-config \
            protobuf-compiler

      - name: Configure
        run: >
          cmake
          -S .
          -B "$BUILD_DIR"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -fprofile-update=atomic"
          -DCMAKE_C_FLAGS="--coverage -fprofile-update=atomic"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DCMAKE_SHARED_LINKER_FLAGS="--coverage"
          -DENABLE_EXAMPLES=ON
          -DENABLE_PROACTOR=OFF

      - name: Build
        run: cmake --build "$BUILD_DIR" --parallel

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" --output-on-failure --timeout 30 --parallel $(nproc)

      - name: Capture coverage with lcov
        run: |
          lcov --capture \
            --directory "$BUILD_DIR" \
            --output-file coverage.info \
            --ignore-errors mismatch,inconsistent,gcov,negative \
            --rc branch_coverage=1

      - name: Extract project coverage only
        run: |
          lcov --extract coverage.info \
            "$(pwd)/src/*" \
            "$(pwd)/include/*" \
            --output-file coverage_filtered.info \
            --ignore-errors empty

      - name: Generate HTML report
        run: |
          genhtml coverage_filtered.info \
            --output-directory coverage-html \
            --title "HPActor Coverage" \
            --legend \
            --branch-coverage

      - name: Extract line coverage percentage
        id: coverage_pct
        run: |
          pct=$(lcov --summary coverage_filtered.info 2>&1 | grep 'lines\.*:' | sed 's/.*: \([0-9.]*\)%.*/\1/')
          echo "pct=${pct}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/
          if-no-files-found: error

      - name: Generate coverage badge
        run: |
          pct="${{ steps.coverage_pct.outputs.pct }}"
          # Pick color: red < 50, yellow < 80, green >= 80
          if (( $(echo "$pct < 50" | bc -l) )); then
            color="#e05d44"
          elif (( $(echo "$pct < 80" | bc -l) )); then
            color="#dfb317"
          else
            color="#4c1"
          fi

          cat > coverage-badge.svg <<BADGE
          <svg xmlns="http://www.w3.org/2000/svg" width="110" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
              <rect width="110" height="20" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
              <rect width="70" height="20" fill="#555"/>
              <rect x="70" width="40" height="20" fill="${color}"/>
              <rect width="110" height="20" fill="url(#b)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="35" y="15" fill="#010101" fill-opacity=".3">coverage</text>
              <text x="35" y="14">coverage</text>
              <text x="90" y="15" fill="#010101" fill-opacity=".3">${pct}%</text>
              <text x="90" y="14">${pct}%</text>
            </g>
          </svg>
          BADGE

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/gh-pages
          cp coverage-badge.svg /tmp/gh-pages/
          cp -r coverage-html /tmp/gh-pages/

          cd /tmp/gh-pages
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update coverage report [skip ci]"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages
