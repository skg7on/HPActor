name: Publish Python Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      repository:
        description: "Package index to publish to"
        required: true
        type: choice
        options:
          - TestPyPI
        default: TestPyPI

permissions:
  contents: read

jobs:
  # ── Build wheels via reusable workflow ──────────────────────────────────

  build:
    uses: ./.github/workflows/python-wheels.yml

  # ── Version consistency gates ───────────────────────────────────────────

  verify-version:
    name: Verify tag/version consistency
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install setuptools-scm>=8,<10

      - name: Resolve version from setuptools-scm
        id: version
        run: |
          RESOLVED=$(python3 -m setuptools_scm)
          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $RESOLVED"

          # Extract tag version (strip 'v' prefix)
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version match
        run: |
          if [ "${{ steps.version.outputs.resolved }}" != "${{ steps.version.outputs.tag_version }}" ]; then
            echo "Version mismatch:"
            echo "  setuptools-scm: ${{ steps.version.outputs.resolved }}"
            echo "  tag:            ${{ steps.version.outputs.tag_version }}"
            exit 1
          fi
          echo "Version verified: ${{ steps.version.outputs.resolved }}"

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.ref }}" origin/main; then
            echo "Tag ${{ github.ref }} is not reachable from main"
            exit 1
          fi

  # ── Build sdist ─────────────────────────────────────────────────────────

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-26.04
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          pip install 'build>=1.2,<2' 'setuptools-scm>=8,<10'
          python3 -m build --sdist

      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── Publish to TestPyPI ─────────────────────────────────────────────────

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-26.04
    needs: [build, build-sdist]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.repository == 'TestPyPI'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hpactor
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: accepted-wheel-set
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Verify artifact count
        run: |
          WHEEL_COUNT=$(ls dist/hpactor-*.whl 2>/dev/null | wc -l)
          SDIST_COUNT=$(ls dist/hpactor-*.tar.gz 2>/dev/null | wc -l)
          echo "Wheels: $WHEEL_COUNT, Sdists: $SDIST_COUNT"
          test "$WHEEL_COUNT" -eq 3 || { echo "Expected 3 wheels"; exit 1; }
          test "$SDIST_COUNT" -eq 1 || { echo "Expected 1 sdist"; exit 1; }

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ── Publish to PyPI ─────────────────────────────────────────────────────

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-26.04
    needs: [build, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/hpactor
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: accepted-wheel-set
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Verify artifact count
        run: |
          WHEEL_COUNT=$(ls dist/hpactor-*.whl 2>/dev/null | wc -l)
          SDIST_COUNT=$(ls dist/hpactor-*.tar.gz 2>/dev/null | wc -l)
          echo "Wheels: $WHEEL_COUNT, Sdists: $SDIST_COUNT"
          test "$WHEEL_COUNT" -eq 3 || { echo "Expected 3 wheels"; exit 1; }
          test "$SDIST_COUNT" -eq 1 || { echo "Expected 1 sdist"; exit 1; }

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
