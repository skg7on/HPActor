name: Python Wheels

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "bindings/python/**"
      - "include/hpactor/python/**"
      - "protos/hpactor/python_binding_internal.proto"
      - "src/**"
      - ".github/workflows/python-wheels.yml"
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Build matrix ──────────────────────────────────────────────────────

  build-wheels:
    name: "wheel ${{ matrix.platform }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            platform: manylinux_2_28_x86_64
            deployment_target: ""
          - os: ubuntu-24.04-arm
            arch: aarch64
            platform: manylinux_2_28_aarch64
            deployment_target: ""
          - os: macos-14
            arch: arm64
            platform: macosx_12_0_arm64
            deployment_target: "12.0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libssl-dev protobuf-compiler libprotobuf-dev ninja-build \
            libabsl-dev 2>/dev/null || true

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 protobuf abseil ninja 2>/dev/null || true

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.2,<2' cibuildwheel==4.1.0 \
            'scikit-build-core>=0.11,<0.14' 'setuptools-scm>=8,<10'

      - name: Build wheel
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_ARCHS: "native"
          CIBW_BEFORE_BUILD: "python -m pip install 'scikit-build-core>=0.11,<0.14' 'setuptools-scm>=8,<10'"
          CIBW_ENVIRONMENT: >-
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}
        run: cibuildwheel --output-dir wheelhouse

      - name: Repair and audit
        run: |
          pip install auditwheel 2>/dev/null || true
          pip install delocate 2>/dev/null || true
          for whl in wheelhouse/hpactor-*.whl; do
            if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
              auditwheel repair --plat "${{ matrix.platform }}" \
                --wheel-dir wheelhouse "$whl"
            else
              delocate-wheel --require-archs "${{ matrix.arch }}" \
                --wheel-dir wheelhouse "$whl"
            fi
          done
          # abi3audit is advisory; don't fail if it flags pybind11 gaps
          pip install abi3audit 2>/dev/null && \
            abi3audit --strict wheelhouse/hpactor-*.whl || true

      - name: Verify wheel
        run: |
          python bindings/python/packaging/verify_wheel.py \
            --wheel wheelhouse/hpactor-*.whl \
            --policy bindings/python/packaging/dependency-policy.json \
            --report wheel-audit.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: |
            wheelhouse/hpactor-*.whl
            wheel-audit.json
            build/wheel-deps/prefix/dependency-build.json
          retention-days: 7

  # ── Acceptance gate ───────────────────────────────────────────────────

  wheel-acceptance:
    name: accept wheels
    needs: [build-wheels]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: accepted/

      - name: Verify artifact set
        run: |
          wheel_count=$(ls accepted/*.whl 2>/dev/null | wc -l)
          echo "Accepted $wheel_count wheels"
          test "$wheel_count" -eq 3 || {
            echo "Expected 3 wheels, got $wheel_count"
            exit 1
          }
          for whl in accepted/*.whl; do
            echo "  $whl"
          done

      - name: Upload accepted set
        uses: actions/upload-artifact@v4
        with:
          name: accepted-wheel-set
          path: accepted/
          retention-days: 7
