name: Python Wheels

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "protos/**"
      - "bindings/python/**"
      - ".github/workflows/python-wheels.yml"
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Wheel build matrix (native platforms only) ──────────────────────────

  build-wheels:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            platform: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            platform: manylinux_2_28_aarch64
          - os: macos-15-intel
            arch: x86_64
            platform: macosx_12_0_x86_64
          - os: macos-14
            arch: arm64
            platform: macosx_12_0_arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python3 -m pip install \
            'cibuildwheel==4.1.0' \
            'build>=1.2,<2' \
            'setuptools-scm>=8,<10'

      - name: Build native dependencies
        run: |
          python3 bindings/python/packaging/build_native_deps.py \
            --prefix build/wheel-deps/prefix \
            --cache build/wheel-deps/cache \
            --build-dir build/wheel-deps/build \
            --jobs "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Build wheels
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_ARCHS: "native"
          CIBW_BEFORE_BUILD: ""
          CMAKE_ARGS: >-
            -DHPACTOR_PYTHON_WHEEL_BUILD=ON
            -DHPACTOR_WHEEL_DEPS_PREFIX=build/wheel-deps/prefix
            -DENABLE_TESTS=OFF
            -DENABLE_EXAMPLES=OFF
            -DENABLE_APPS=OFF
        run: python3 -m cibuildwheel --output-dir wheelhouse

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install auditwheel
          auditwheel repair --plat "${{ matrix.platform }}" \
            --wheel-dir wheelhouse wheelhouse/hpactor-*.whl
          # Replace raw wheel with repaired one
          rm wheelhouse/hpactor-*cp311-*.whl 2>/dev/null || true
          mv wheelhouse/hpactor-*manylinux*.whl wheelhouse/ 2>/dev/null || true

      - name: Repair wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install delocate
          delocate-wheel --require-archs "${{ matrix.arch }}" \
            --wheel-dir wheelhouse --verbose wheelhouse/hpactor-*.whl
          rm wheelhouse/hpactor-*cp311-*.whl 2>/dev/null || true
          mv wheelhouse/hpactor-*macosx*.whl wheelhouse/ 2>/dev/null || true

      - name: ABI3 audit
        run: |
          python3 -m pip install abi3audit
          abi3audit --strict wheelhouse/hpactor-*.whl

      - name: Run verify_wheel
        run: |
          python3 bindings/python/packaging/verify_wheel.py \
            --wheel "$(ls wheelhouse/hpactor-*.whl | head -1)" \
            --policy bindings/python/packaging/dependency-policy.json \
            --report wheel-audit.json

      - name: Create checksums
        run: |
          cd wheelhouse
          sha256sum hpactor-*.whl > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            wheelhouse/hpactor-*.whl
            wheelhouse/SHA256SUMS
            wheel-audit.json

  # ── Cross-minor CPython compatibility ───────────────────────────────────

  smoke-test:
    name: Smoke ${{ matrix.python }} on ${{ matrix.runner-os }}
    needs: build-wheels
    runs-on: ${{ matrix.runner-os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner-os: ubuntu-24.04
            python: "3.11"
            wheel-artifact: wheel-manylinux_2_28_x86_64-x86_64
          - runner-os: ubuntu-24.04
            python: "3.12"
            wheel-artifact: wheel-manylinux_2_28_x86_64-x86_64
          - runner-os: ubuntu-24.04
            python: "3.13"
            wheel-artifact: wheel-manylinux_2_28_x86_64-x86_64
          - runner-os: ubuntu-24.04
            python: "3.14"
            wheel-artifact: wheel-manylinux_2_28_x86_64-x86_64
          - runner-os: macos-14
            python: "3.11"
            wheel-artifact: wheel-macosx_12_0_arm64-arm64
          - runner-os: macos-14
            python: "3.12"
            wheel-artifact: wheel-macosx_12_0_arm64-arm64
          - runner-os: macos-14
            python: "3.13"
            wheel-artifact: wheel-macosx_12_0_arm64-arm64
          - runner-os: macos-14
            python: "3.14"
            wheel-artifact: wheel-macosx_12_0_arm64-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.wheel-artifact }}
          path: wheelhouse

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run clean smoke
        run: |
          python3 bindings/python/tests/wheel/run_clean_smoke.py \
            --python "python${{ matrix.python }}" \
            --wheel "$(ls wheelhouse/hpactor-*.whl | head -1)"

  # ── Acceptance gate ─────────────────────────────────────────────────────

  wheel-acceptance:
    name: Accept wheel set
    needs: [build-wheels, smoke-test]
    runs-on: ubuntu-24.04
    if: always()

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: all-wheels
          merge-multiple: true

      - name: Verify four distinct platform wheels
        run: |
          whls=$(ls all-wheels/hpactor-*.whl 2>/dev/null | wc -l)
          echo "Wheel count: $whls"
          test "$whls" -eq 4 || {
            echo "Expected 4 wheels, found $whls"
            exit 1
          }

      - name: Verify checksums
        run: |
          cd all-wheels
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: accepted-wheel-set
          path: all-wheels/
