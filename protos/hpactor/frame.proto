// protos/hpactor/frame.proto
syntax = "proto3";

package hpactor.net;

import "hpactor/common.proto";

message PbTraceContext {
  bytes trace_id = 1;
  bytes span_id = 2;
  uint32 flags = 3;
  string tracestate = 4;
}

message ActorMsgFrame {
  hpactor.PbActorAddress sender = 1;
  hpactor.PbActorAddress receiver = 2;
  uint32 type_tag = 3;
  uint64 message_id = 4;
  uint32 flags = 5;
  bytes payload = 6;
  PbTraceContext trace_context = 7;
}

// ── Reliable messaging control frames ─────────────────────────────────────

enum NackReason {
  NACK_UNSPECIFIED = 0;
  NACK_MAILBOX_FULL = 1;       // retryable — sender should back off
  NACK_ACTOR_DEAD = 2;         // non-retryable — route to DLQ
  NACK_EXPIRED = 3;            // non-retryable — route to DLQ
  NACK_REJECTED_BY_POLICY = 4; // non-retryable — route to DLQ
  NACK_DUPLICATE = 5;          // already seen — treat as ACK
}

message AckFrame {
  uint64 message_id = 1;
  hpactor.PbActorAddress sender = 2;
  uint64 sender_node_id = 3;
}

message NackFrame {
  uint64 message_id = 1;
  hpactor.PbActorAddress sender = 2;
  uint64 sender_node_id = 3;
  NackReason reason = 4;
  uint32 retry_after_ms = 5;
}

// ── Batch messaging ──────────────────────────────────────────────────────

message BatchEntry {
  uint32 type_tag = 1;
  uint64 message_id = 2;
  uint32 flags = 3;
  bytes payload = 4;
  PbTraceContext trace_context = 5;
}

message BatchMsgFrame {
  hpactor.PbActorAddress sender = 1;
  hpactor.PbActorAddress receiver = 2;
  repeated BatchEntry entries = 3;
}

// ── Stream protocol ───────────────────────────────────────────────────────

message StreamOpenFrame {
  uint64 stream_id = 1;
  hpactor.PbActorAddress sender = 2;
  hpactor.PbActorAddress receiver = 3;
  uint32 initial_window_bytes = 4;
  PbTraceContext trace_context = 5;
}

message StreamDataFrame {
  uint64 stream_id = 1;
  uint64 sequence = 2;
  bytes payload = 3;
  uint32 user_tag = 4; // Original TypeTag from StreamHandle::write()
}

message StreamAckFrame {
  uint64 stream_id = 1;
  uint64 last_sequence = 2;
  uint32 window_bytes = 3;
}

message StreamCloseFrame {
  uint64 stream_id = 1;
  enum CloseReason {
    COMPLETE = 0;
    CANCELLED = 1;
    TIMEOUT = 2;
  }
  CloseReason reason = 2;
}

message StreamErrorFrame {
  uint64 stream_id = 1;
  uint32 error_code = 2;
  string description = 3;
}

// ── Connection handshake (NET-001) ──────────────────────────────────────────

// Result of a handshake negotiation.
enum HandshakeResult {
  HANDSHAKE_ACCEPTED = 0;            // Versions compatible, flags negotiated.
  HANDSHAKE_INCOMPATIBLE_VERSION = 1; // Version ranges are disjoint.
  HANDSHAKE_INCOMPATIBLE_FLAGS = 2;   // Required feature flags not supported.
  HANDSHAKE_AUTH_FAILED = 3;          // Authentication failed (reserved for
                                      // NET-002).
}

// Sent by the connecting client immediately after TCP/TLS connect.
message HandshakeHello {
  uint32 min_version = 1;    // Lowest protocol version this node supports.
  uint32 max_version = 2;    // Highest protocol version this node supports.
  uint64 feature_flags = 3;  // Bitmask of supported optional features.
  uint64 node_id = 4;        // Sender node identity for logging/metrics.
}

// Sent by the server in response to HandshakeHello.
message HandshakeResponse {
  uint32 accepted_version = 1; // Negotiated version (0 if rejected).
  uint64 feature_flags = 2;    // Intersection of client and server flags.
  uint64 node_id = 3;          // Server node identity.
  HandshakeResult result = 4;  // Negotiation outcome.
}

// ── Wire envelope ───────────────────────────────────────────────────────────

// Envelope wrapper for frame type dispatch.
// Replaces raw ActorMsgFrame on the wire when the peer supports
// reliable messaging (negotiated in handshake, follow-up issue).
message WireEnvelope {
  oneof payload {
    ActorMsgFrame data_frame = 1;
    AckFrame ack_frame = 2;
    NackFrame nack_frame = 3;
    BatchMsgFrame batch_frame = 4;
    StreamOpenFrame stream_open = 5;
    StreamDataFrame stream_data = 6;
    StreamAckFrame stream_ack = 7;
    StreamCloseFrame stream_close = 8;
    StreamErrorFrame stream_error = 9;
  }
}
