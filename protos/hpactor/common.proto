// protos/hpactor/common.proto
syntax = "proto3";

package hpactor;

// Common protobuf types for HPActor serialization
// These types are shared between frame.proto (transport) and messages.proto (application messages)
// Naming: Pb-prefixed to avoid collision with C++ types in hpactor namespace

message PbIpv4Endpoint {
  fixed32 addr = 1;
  uint32 port = 2;
}

message PbIpv6Endpoint {
  bytes addr = 1;
  uint32 port = 2;
}

message PbActorEndpoint {
  oneof type {
    PbIpv4Endpoint ipv4 = 1;
    PbIpv6Endpoint ipv6 = 2;
  }
}

message PbLocalActorAddress {
  uint32 actor_type = 1;
  uint64 actor_id = 2;
  uint64 incarnation = 3;
}

message PbGlobalActorAddress {
  PbActorEndpoint endpoint = 1;
  PbLocalActorAddress local_addr = 2;
}

message PbActorRef {
  oneof type {
    PbLocalActorAddress local_addr = 1;
    PbGlobalActorAddress global_addr = 2;
  }
}

message PbActorAddress {
  oneof type {
    PbLocalActorAddress local_addr = 1;
    PbGlobalActorAddress global_addr = 2;
  }
}

message MetricsRequest {
    // Empty — triggers full ring buffer drain + snapshot + reply.
}

message MetricsResponse {
    bytes body = 1;  // OpenMetrics formatted text.
}
