syntax = "proto3";
package hpactor.cli;

// ── Actor Inspection ──

message InspectStateRequest {
    uint64 target_actor_id = 1;
    bool include_state = 3;
    bool include_mailbox = 4;
    bool include_children = 5;
    bool include_circuit_breaker = 6;
    bool include_quarantine_info = 7;
    bool include_rate_limiter = 8;
    bool include_admission = 9;
}

message CircuitBreakerInfo {
    string state = 1;           // "closed", "open", "half_open"
    uint32 trip_count = 2;      // number of times circuit has tripped
    double failure_ema = 3;     // exponential moving average failure rate
    uint64 opened_at_ns = 4;    // monotonic timestamp when circuit opened (0 if not open)
}

message InspectStateReply {
    uint64 actor_id = 1;
    ActorMetadata metadata = 2;
    bytes state_blob = 3;
    MailboxSnapshot mailbox = 4;
    repeated ChildInfo children = 5;
    CircuitBreakerInfo circuit_breaker = 6;
    string quarantine_reason = 7;   // reason if quarantined, empty otherwise
    bool quarantine_enabled = 8;    // whether quarantine is configured
}

message ActorMetadata {
    uint64 actor_id = 1;
    string actor_type = 2;
    string state = 3;
    uint64 incarnation = 4;
    uint64 messages_processed = 5;
    uint64 uptime_ms = 6;
    string behavior_name = 7;
}

message MailboxSnapshot {
    uint32 depth = 1;
    uint64 total_enqueued = 2;
    uint64 total_dequeued = 3;
    uint64 max_depth = 4;
    uint32 high_priority_depth = 5;
    uint32 capacity = 6;
    uint64 queued_bytes = 7;
    uint64 byte_capacity = 8;
    uint32 pressure_ratio_ppm = 9;
    uint64 total_rejected = 10;
    uint64 total_dropped = 11;
    uint64 total_dead_letters = 12;
    string pressure_state = 13;
    string overflow_policy = 14;
    bool rate_limiter_enabled = 15;
    double rate_limiter_rate = 16;
    uint32 rate_limiter_burst = 17;
    double rate_limiter_current_tokens = 18;
    uint64 rate_limit_blocked_total = 19;
    uint32 admission_policy_count = 20;
    uint64 admission_rejected_total = 21;
    uint64 admission_dlq_routed_total = 22;
    uint64 delivery_accepted_total = 23;
    uint64 delivery_rejected_total = 24;
    uint64 delivery_failed_total = 25;
    uint64 delivery_retryable_total = 26;
}

message ChildInfo {
    uint64 actor_id = 1;
    string actor_type = 2;
    string state = 3;
}

// ── Actor Termination ──

message KillRequest {
    uint64 target_actor_id = 1;
    bool force = 2;
}

message KillReply {
    bool success = 1;
    uint32 error_code = 2;
    string error_message = 3;
}

// ── Actor Listing ──

message ListActorsRequest {
    uint32 shard_index = 1;
    uint32 offset = 2;
    uint32 limit = 3;
    string filter = 4;
}

message ListActorsReply {
    repeated ActorMetadata actors = 1;
    bool has_more = 2;
    uint32 next_shard_index = 3;
    uint32 next_offset = 4;
    uint32 total_count = 5;
}

// ── System Stats ──

message SystemStatsRequest {}

message SystemStatsReply {
    uint64 total_actors = 1;
    uint64 running_actors = 2;
    uint64 idle_actors = 3;
    uint32 worker_count = 6;
    double scheduler_utilization = 7;
    uint64 memory_active_bytes = 8;
    uint64 uptime_ms = 10;
}

// ── System Memory ──

message MemoryStatsRequest {
    uint64 actor_id = 1;  // 0 = system-wide
}

message MemoryStatsReply {
    uint64 active_bytes = 1;
    uint64 peak_bytes = 2;
    uint32 segment_count = 3;
    double slab_hit_rate = 4;
}

// ── Quarantine Control ──

message QuarantineRequest {
    uint64 target_actor_id = 1;
    string reason = 2;  // operator-provided reason text
    bool unquarantine = 3;  // true = release from quarantine
}

message QuarantineReply {
    bool success = 1;
    string error_message = 2;
}
